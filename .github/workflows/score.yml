# Scores each drawing the morning after, so the site shows results without waiting
# for the next drawing-day run. Scoring is plain Python; it doesn't need Claude.
name: Score

on:
  schedule:
    # 6 AM ET (5 AM in winter) on Sun, Tue, Thu. New York posts results around 3:30 AM ET, and GitHub can
    # start scheduled jobs a few hours late, so results still land by mid-morning.
    - cron: "0 10 * * 0,2,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 lotto.py score
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.csv stats.json
          git diff --cached --quiet || (git commit -m "Scores" && git push)

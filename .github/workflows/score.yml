# Scores each drawing once its results are out. The Worker in worker/ starts this as soon as they are; the
# schedule below is the fallback. Scoring is plain Python; it doesn't need Claude. When it scores something,
# it starts Claude's routine so Claude reacts and picks for the next drawing that night (see ROUTINE.md).
name: Score

on:
  schedule:
    # The fallback if the Worker's dispatch didn't happen: 6 AM ET (5 AM in winter) on Sun, Tue, Thu. GitHub
    # can start scheduled jobs hours late.
    - cron: "0 10 * * 0,2,4"
  workflow_dispatch:
    inputs:
      test_routine:
        description: "Start Claude's routine even if nothing new was scored, to test the trigger"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score
        id: score
        run: |
          set -o pipefail
          python3 lotto.py score | tee score.log
          # lotto.py says this when a drawing with Claude's ticket was just scored and Claude hasn't reacted yet.
          if grep -q "Claude hasn't reacted" score.log; then echo "react=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.csv stats.json
          git diff --cached --quiet || (git commit -m "Scores" && git push)
      # Claude reacts and picks for the next drawing that night instead of at the next drawing-day run.
      # Skipped until the routine's API trigger token is saved as the ROUTINE_FIRE_TOKEN secret.
      - name: Start Claude's routine
        if: steps.score.outputs.react == 'true' || inputs.test_routine
        env:
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_FIRE_TOKEN" ]; then echo "No ROUTINE_FIRE_TOKEN secret; skipping."; exit 0; fi
          # A pasted secret can pick up a line break or stray spaces; a token never has any.
          token=$(printf '%s' "$ROUTINE_FIRE_TOKEN" | tr -d '[:space:]')
          curl -sS --fail-with-body -X POST https://api.anthropic.com/v1/claude_code/routines/trig_01Uzh4ewvG4ZemsKrEs8hX2e/fire \
            -H "Authorization: Bearer $token" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{"text": "A drawing was just scored. React to it and pick for the next drawing, following ROUTINE.md."}'

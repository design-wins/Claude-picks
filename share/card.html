<!doctype html>
<!-- The link preview image (Open Graph / Twitter card). Not linked from the site.
     Regenerate share/card.png after editing:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=5000 --screenshot=share/card.png share/card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude picks share card</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block" rel="stylesheet">
<style>
  /* Same tokens as index.html: the desperate mood, its ink, the Powerball red */
  :root { --mood: #5f5a6e; --ink: #f3ecd9; --ink-2: #d4ccbb; --face-ink: #1b1f2a; --red: #e0322b; --tear: #5b8fd4;
    --melt: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; --display: "Anton", Impact, sans-serif; --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { margin: 0; box-sizing: border-box; animation: none !important; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--mood); color: var(--ink); font-family: var(--body); padding: 0 72px; display: grid; align-items: center; }
  .main { display: grid; grid-template-columns: 360px 1fr; gap: 56px; align-items: center; }
  .face { width: 360px; height: 360px; display: block; overflow: visible; }
  .face .stroke { fill: none; stroke: var(--face-ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .face .thin { stroke-width: 4; }
  h1 { font: 420 84px/1 var(--melt); font-stretch: 84%; letter-spacing: -0.025em; font-variation-settings: "opsz" 96; }
  p { margin-top: 22px; font-size: 29px; line-height: 1.35; font-weight: 500; color: var(--ink-2); max-width: 28ch; }
  .balls { display: flex; gap: 12px; margin-top: 30px; }
  .ball { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font: 400 28px var(--display); color: #1b1f2a;
    background: radial-gradient(circle at 35% 30%, #fff 0, #f2f3f5 58%, #cfd4dc 100%); box-shadow: 0 3px 6px rgba(0, 0, 0, .25), inset 0 -2px 4px rgba(27, 31, 42, .08); }
  .ball.pb { background: radial-gradient(circle at 30% 25%, #ec5a4f 0, var(--red) 40%, #a8241f 100%); color: #fff; text-shadow: 0 1px 2px rgba(80, 10, 8, .45); }
</style>
</head>
<body>
  <div class="main">
    <!-- The desperate face, copied from the page's own drawing -->
    <svg class="face" viewBox="0 0 200 200" aria-hidden="true">
      <defs><radialGradient id="shade" cx="38%" cy="30%" r="75%">
        <stop offset="0" stop-color="#eceae4"/><stop offset=".65" stop-color="#d4d0c6"/><stop offset="1" stop-color="#b3ad9f"/>
      </radialGradient></defs>
      <ellipse cx="100" cy="192" rx="52" ry="6" fill="#1b1f2a" opacity=".16"/>
      <g fill="#6d6a62"><circle cx="80" cy="20" r="13"/><circle cx="100" cy="13" r="16"/><circle cx="121" cy="20" r="13"/><rect x="67" y="18" width="67" height="16" rx="8"/></g>
      <g stroke="var(--tear)" stroke-width="3" stroke-linecap="round"><line x1="78" y1="38" x2="75" y2="47"/><line x1="92" y1="40" x2="89" y2="49"/><line x1="106" y1="38" x2="103" y2="47"/><line x1="120" y1="40" x2="117" y2="49"/></g>
      <circle cx="100" cy="114" r="70" fill="url(#shade)"/>
      <path d="M64 92 L88 86 M112 86 L136 92" class="stroke thin"/>
      <circle cx="78" cy="104" r="12" fill="#fff" stroke="#1b1f2a" stroke-width="3"/>
      <path d="M68 101 l5 2 M69 109 l5 -2 M88 100 l-5 3 M87 109 l-4 -2" stroke="#d6262f" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="79" cy="105" r="3.2" fill="#1b1f2a"/>
      <circle cx="122" cy="104" r="12" fill="#fff" stroke="#1b1f2a" stroke-width="3"/>
      <path d="M112 101 l5 2 M113 109 l5 -2 M132 100 l-5 3 M131 109 l-4 -2" stroke="#d6262f" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="123" cy="105" r="3.2" fill="#1b1f2a"/>
      <path d="M67 119 Q78 126 89 119 M111 119 Q122 126 133 119" stroke="#1b1f2a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".45"/>
      <path d="M82 148 Q100 133 118 148" class="stroke"/>
      <g fill="#1b1f2a" opacity=".35"><circle cx="78" cy="160" r="1.6"/><circle cx="88" cy="166" r="1.6"/><circle cx="100" cy="168" r="1.6"/><circle cx="112" cy="166" r="1.6"/><circle cx="122" cy="160" r="1.6"/><circle cx="84" cy="172" r="1.6"/><circle cx="96" cy="175" r="1.6"/><circle cx="106" cy="175" r="1.6"/><circle cx="116" cy="172" r="1.6"/><circle cx="70" cy="152" r="1.6"/><circle cx="130" cy="152" r="1.6"/></g>
      <g transform="rotate(-14 118 146)">
        <rect x="116" y="142" width="40" height="8" rx="1.5" fill="#f4efe2" stroke="#1b1f2a" stroke-width="1.5"/>
        <rect x="116" y="142" width="11" height="8" rx="1.5" fill="#d98c3a" stroke="#1b1f2a" stroke-width="1.5"/>
        <circle cx="156" cy="146" r="3.6" fill="#ff5a1f"/>
      </g>
      <path d="M155 133 q-6 -8 0 -16 q6 -8 0 -16" stroke="#c8c4bb" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    </svg>
    <div>
      <h1>Claude has a problem.</h1>
      <p>He picks Powerball numbers. A script keeps score. No real tickets, so he can only lose in spirit. He does.</p>
      <!-- Claude's first ticket, Oct 14 -->
      <div class="balls"><span class="ball">09</span><span class="ball">17</span><span class="ball">26</span><span class="ball">41</span><span class="ball">58</span><span class="ball pb">13</span></div>
    </div>
  </div>
</body>
</html>
